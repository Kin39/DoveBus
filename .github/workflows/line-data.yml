# Refreshes the line data behind the line pages once a week, without a person.
#
# `client/seo/lines.json` is a snapshot of one edition of the regional timetable,
# and the build refuses to publish it once that edition's window has closed —
# which happened on 28 October 2026 with nobody noticing for three days. This
# does what was done by hand: import the current feed, regenerate the file on a
# full midweek day, and check it against the published pages before anything is
# committed (`npm run seo-refresh`, and `server/src/seo/editions.ts` for what
# blocks and why).
#
# For now the result is a pull request the owner merges (DoveBus-plan.md §15.2);
# a direct push comes after two good runs and the IndexNow step. Pushes and pull
# requests made with this workflow's token do not start other workflows, so the
# whole of ci.yml runs here, before the pull request exists.
#
# Every run reports to healthchecks.io (`pagine-linee`): success when the feed
# was unchanged or a pull request was opened, failure otherwise, and silence past
# a week and a day if the schedule itself stops — GitHub disables scheduled
# workflows after 60 days without activity in the repository.

name: Line data

on:
  schedule:
    # Tuesdays, early: the reference day can then be that same Tuesday.
    - cron: "17 5 * * 2"
  workflow_dispatch:

# Write access is this workflow's alone; ci.yml stays read-only.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: line-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # `runner` is not available to a job-level `env`, so the path is set here.
      - name: Locate the report
        run: echo "REPORT=$RUNNER_TEMP/report.md" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # With no database yet, refresh downloads the feed and imports it.
      - name: Import the current timetable
        run: npm run refresh

      - name: Regenerate the line data and check it
        id: seo
        run: npm run seo-refresh -w @dovebus/server -- --report="$REPORT"

      - name: Run the checks ci.yml would run
        if: steps.seo.outputs.outcome == 'written'
        run: |
          npm run typecheck
          npm run check
          npm run coverage
          npm run build:client

      # One branch and at most one open pull request: a week left unmerged is
      # replaced by the next week's data rather than joined by a second PR.
      - name: Open or update the pull request
        if: steps.seo.outputs.outcome == 'written'
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ steps.seo.outputs.edition }}
          REFERENCE: ${{ steps.seo.outputs.reference }}
        run: |
          branch="line-data/refresh"
          title="chore: refresh the line data onto the ${EDITION} timetable"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add client/seo/lines.json
          { echo "$title"; echo; cat "$REPORT"; } > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git push --force origin "$branch"
          {
            cat "$REPORT"
            echo
            echo "Generated by the weekly line-data workflow, reference day ${REFERENCE}."
            echo "Typecheck, Biome, tests with coverage and the site build passed in that run."
            echo "After merging, run \`npm run indexnow\` once Netlify has published."
          } > "$RUNNER_TEMP/body.md"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.seo.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Line data: automatic refresh needs attention"
          case "$OUTCOME" in
            blocked) what="A check on the new data blocked the refresh." ;;
            written) what="The new data passed its checks, but a later step failed (the site checks, the push or the pull request)." ;;
            *) what="The run failed before the line data could be compared (import or download)." ;;
          esac
          {
            echo "$what"
            echo
            if [ -s "$REPORT" ]; then cat "$REPORT"; fi
            echo
            echo "Run: $RUN_URL"
            echo "The committed lines.json was not changed. It expires at the end of its edition's window."
          } > "$RUNNER_TEMP/issue.md"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Report to healthchecks
        if: always()
        env:
          HC_URL: ${{ secrets.HC_LINE_DATA_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then suffix=""; else suffix="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null --data-binary "@${REPORT}" "${HC_URL}${suffix}" ||
            curl -fsS -m 10 --retry 3 -o /dev/null "${HC_URL}${suffix}" || true
