<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <!-- The theme is light paper; the browser chrome should match the map, not
         the dark theme this replaced. -->
    <meta name="theme-color" content="#ffffff" />

    <!--
      Deliberately *not* "Mappa live dei bus in Toscana": that is the landing
      page's phrase, and two URLs on one head term is one URL too many — Google
      picks a winner and the loser's equity goes nowhere. `/` keeps «dove sono
      gli autobus in Toscana» because it is the page that can actually rank on
      it (prose, FAQ, entity markup). This page takes the intent `/` cannot
      serve and does not compete for: *which* line, *which* connection.
    -->
    <title>Cerca la tua linea o un collegamento — DoveBus</title>
    <meta
      name="description"
      content="Cerca una linea Autolinee Toscane o un collegamento diretto fra due comuni toscani, poi segui la corsa: posizione, ritardo, percorso ed età del dato."
    />
    <link rel="canonical" href="%SITE_URL%/mappa/" />

    <!--@hreflang-->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DoveBus" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Cerca la tua linea o un collegamento — DoveBus" />
    <meta
      property="og:description"
      content="Cerca una linea o un collegamento fra due comuni toscani e segui la corsa in diretta, con ritardo, percorso ed età della posizione."
    />
    <meta property="og:url" content="%SITE_URL%/mappa/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DoveBus: la scala della freschezza del dato, da «in diretta» a «silenzioso»."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      The basemap host, opened as early as the parser can manage: the style, the
      glyphs and the first tiles are all behind this one TLS handshake, and it is
      the only third party this page contacts. `dns-prefetch` covers the raster
      fallback, which is only reached if OpenFreeMap does not answer — worth a
      DNS lookup, not worth a connection that usually goes unused.

      Neither belongs on the content pages: those talk to nobody.
    -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />

    <!--
      The wordmark composes in HTML, but an icon cannot: these are exported at
      their real size. The background is opaque #0d1825 in every cut, never
      transparent — the green dot on a light browser bar measures 1.97:1 and
      disappears. At 16 px the lettering stops being readable, so that cut is the
      dot alone.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--@partial:jsonld-app-->

    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#sheet">Vai alla ricerca</a>

    <!--
      The page's heading, clipped rather than drawn. The design puts the wordmark
      where an H1 would go, which is right for a full-bleed map and wrong for
      anything reading the document: without this the served page has no heading
      at all. It is not a keyword insertion — it is the same sentence the title
      makes, said once in the body where a heading belongs.
    -->
    <h1 class="sr-only">Cerca la tua corsa Autolinee Toscane e seguila sulla mappa</h1>

    <div id="map" class="map" role="application" aria-label="Mappa dei bus in Toscana"></div>

    <header class="topbar" id="topbar">
      <!--
        The wordmark is the way back to the landing page — and the only chrome
        this page gains from having a site around it.

        Deliberately not a hamburger. The map owns the screen and the sheet owns
        the thumb; a third control in the top bar would compete with the fleet
        counter at 320 px and buy a drawer, a focus trap and more script on the
        heaviest page of the site. The pages a rider might want from here —
        privacy, sources — are linked from the credits block at the bottom of the
        sheet, which is where the attribution they belong with already lives.
      -->
      <a class="brand" href="/" aria-label="DoveBus — vai alla pagina iniziale">
        <span class="brand__dove">Dove</span><span class="brand__bus">Bus</span
        ><span class="brand__dot" aria-hidden="true"></span>
      </a>
      <p class="fleet" id="fleet" aria-live="polite">
        <span class="fleet__count" id="fleet-count">—</span>
        <span class="fleet__unit">bus in vista</span>
      </p>
    </header>

    <!--
      The two controls the map itself owns, stacked in the corner: the language
      first, because it is the one a reader who cannot read this page needs, and
      the framing below it.

      The framing button used to wear a crosshair — the icon every map on earth
      uses for "find my location", which this one deliberately does not do: it
      never asks the browser where you are. An icon that promises a feature the
      product refuses to have is worse than no icon, so it is four corner
      brackets now: frame the region, or frame the trip being followed.
    -->
    <div class="mapctl">
      <!--@langswitch:map-->
      <button
        type="button"
        class="mapctl__button"
        id="recenter"
        aria-label="Inquadra tutta la Toscana"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 9V5.6a1.6 1.6 0 0 1 1.6-1.6H9M15 4h3.4A1.6 1.6 0 0 1 20 5.6V9M20 15v3.4a1.6 1.6 0 0 1-1.6 1.6H15M9 20H5.6A1.6 1.6 0 0 1 4 18.4V15" />
        </svg>
      </button>
    </div>

    <section class="sheet" id="sheet" aria-label="Ricerca corse">
      <button
        type="button"
        class="sheet__handle"
        id="sheet-handle"
        aria-label="Trascina per ridimensionare il pannello"
      >
        <span class="sheet__grip" aria-hidden="true"></span>
      </button>
      <!--
        What the sheet holds before the app fills it — and everything a reader
        without JavaScript gets. `#showSearch()` runs in the constructor and
        `clear()`s this node, so it is gone by first paint and cannot duplicate
        the footer the app renders.

        It exists because the CC-BY line and the three site links were, on this
        page alone, produced by a script. Every other page carries them in the
        served HTML through the footer partial; a licence obligation discharged
        only for clients that execute JavaScript is not discharged. The links
        also mean this page stops being a dead end: before this it had exactly
        one outbound internal link, the wordmark.

        The basemap is credited generically here, as the app does until its style
        settles — naming CARTO for tiles OpenFreeMap served would be a false
        statement in the one place the licence asks for an exact one.
      -->
      <div class="sheet__scroll" id="sheet-scroll">
        <footer class="credits">
          <p>Dati: Regione Toscana — dati.toscana.it (CC BY 4.0)</p>
          <p>Confini comunali: openpolis / ISTAT · Mappa © OpenStreetMap</p>
          <nav class="credits__nav" aria-label="Pagine del sito">
            <a href="/come-funziona/">Come funziona</a>
            <a href="/fonte-dati/">Fonte dati</a>
            <a href="/privacy/">Privacy</a>
          </nav>
        </footer>
      </div>
    </section>

    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  </body>
</html>
