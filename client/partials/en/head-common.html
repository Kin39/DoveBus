<!--
  Everything in the `<head>` that is identical on every English content page.
  What stays per-page is the part that must never be copied: `title`,
  `description`, `canonical`, the Open Graph title/description/url, the
  `hreflang` pair, and the JSON-LD.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="DoveBus" />
<meta property="og:locale" content="en_GB" />
<meta property="og:locale:alternate" content="it_IT" />
<meta property="og:image" content="%SITE_URL%/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta
  property="og:image:alt"
  content="DoveBus: the data-freshness scale, from “live” to “silent”."
/>
<meta name="twitter:card" content="summary_large_image" />

<!--
  The wordmark composes in HTML, but an icon cannot: these are exported at their
  real size. The background is opaque #0d1825 in every cut, never transparent —
  the green dot on a light browser bar measures 1.97:1 and disappears. At 16 px
  the lettering stops being readable, so that cut is the dot alone.
-->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
<link rel="manifest" href="/site-en.webmanifest" />

<script type="module" src="/src/site/site.ts"></script>
