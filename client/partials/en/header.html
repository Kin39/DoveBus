<!--
  One row, on every viewport down to 320 px: the wordmark and the one action a
  visitor came for. The two text links appear from 600 px up, where there is
  room for them — and the pages they point to are reachable below that from the
  footer of every page, from the body copy that mentions them, and from the
  sub-navigation the trust pages carry.

  Deliberately no hamburger: a drawer would be a script, a focus trap and an
  overlay bought to hide three links from a site that has four pages.

  The language switch stays at every width, including 320 px where the two text
  links do not: those pages are reachable from the footer, and a reader who
  cannot read the page they are on has no footer to get to.
-->
<header class="sitehead">
  <div class="shell sitehead__row">
    <a class="brand" href="/en/" aria-label="DoveBus — home page">
      <span class="brand__dove">Dove</span><span class="brand__bus">Bus</span
      ><span class="brand__dot" aria-hidden="true"></span>
    </a>
    <nav class="sitehead__nav" aria-label="Main">
      <a class="sitehead__link" href="/en/how-it-works/">How it works</a>
      <a class="sitehead__link" href="/en/data-source/">Data source</a>
      <!--@langswitch:nav-->
      <a class="button button--compact" href="/en/map/">
        Open the map <span class="button__arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </div>
</header>
